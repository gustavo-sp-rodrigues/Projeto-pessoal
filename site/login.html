<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/style_login_volei.css">

</head>

<body>
<header>
        <div class="header">

            <div class="logo">
                <span class="bola"><img src="img/imagem_logo.png" alt=""></span>
              
            </div>

            <nav>
                <div class="home-btn">
                    <a href="home.html">Home</a>
                  
                    <a href="dashboard_pelezao.html">comentarios</a>
                    
                    
                    <a href="login.html">login</a>
                    <a href="cadastro.html">cadastro</a>
                    
                </div>

            </nav>

        </div>
    </header>





    <div class="login">
        <div class="img">
            <span>Seu novo time começa aqui</span>
        </div>

        <div class="campos-login">
            <div class="titulo">
                <h1>Entre no jogo</h1>
            </div>
            <label for="ipt_email">Seu email</label>
            <input type="text" id="ipt_email">

            <label for="ipt_senha">Senha:</label>
            <input type="text " id="ipt_senha">

          
            <div class="btn-entrar">
                <button onclick="entrar()">Login</button>
            </div>

        </div>
        
        <div id="div_msg"></div>
    </div>
</body>

</html>
<script>
    function entrar() {
        let email = document.getElementById("ipt_email").value;
        let senha = document.getElementById("ipt_senha").value;
        let div_msg = document.getElementById("div_msg");

        if (email == "" || senha == "") {
            div_msg.innerHTML = "Preencha e-mail e senha.";
            return;
        }

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                emailServer: email,
                senhaServer: senha
            })
        }).then(function (resposta) {
            if (resposta.status == 200) {
                return resposta.json();
            } else {
                return resposta.text().then(function (texto) {
                    throw new Error(texto);
                });
            }
        }).then(function (usuario) {
            sessionStorage.ID_USUARIO = usuario.id;
            sessionStorage.NOME_USUARIO = usuario.nome;
            sessionStorage.EMAIL_USUARIO = usuario.email;

            window.location.href = "espera1.html";
        }).catch(function (erro) {
            div_msg.innerHTML = erro.message;
        });
    }
</script>
