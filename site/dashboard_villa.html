<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="css/style_dashsboard.css">

    <title>Dashboard</title>
</head>

<body>
    <header>
        <div class="header">

            <div class="logo">
                <span class="bola"><img src="img/imagem_logo.png" alt=""></span>
                
            </div>

            <nav>
                <div class="home-btn">
                    <a href="index.html">Home</a>
                    <a href="index.html#historia">História </a>
                    <a href="index.html#posicoes">Posições</a>
                    <a href="index.html#lugares">Lugares</a>
                    <a href="dashboard_pelezao.html">Pelezão</a>
                    <a href="dashboard_villa.html">Villa-Lobos</a>
                    <a href="dashboard_sesc.html">Sesc</a>

                    
                    
                    <a href="login.html">login</a>
                    <a href="cadastro.html">cadastro</a>
                    <button type="button" id="btn_sair" style="display: none;" onclick="limpar_sessao()">Encerrar sessão</button>
                    
                </div>

            </nav>

        </div>
    </header>

    <div class="container-geral">

        <div class="container-esquerda">

            <div class="usuario">
                <h2>Olá: <span id="nome_usuario">visitante</span></h2>
            </div>

            <select name="" id="selecao_local" onchange="mudar()">
                <option value="1">Pelezão</option>
                <option value="2" selected>Parque villa Lobos</option>
                <option value="3">Sesc Pompéia</option>
            </select>

            <p id="aviso_visitante" class="aviso-visitante" style="display: none;">
                Cadastre-se para comentar e avaliar este local.
                <a href="espera.html">Criar conta</a>
            </p>

            <form class="form-comentario" onsubmit="enviar_comentario(); return false;">
                <label for="nota_localizacao">Nota Localização ✰✰✰✰✰</label>
                <select id="nota_localizacao">
                    <option value="0" disabled selected>deixe sua nota ✰✰✰✰✰</option>
                    <option value="5">5 - Excelente ⭐⭐⭐⭐⭐</option>
                    <option value="4">4 - Muito bom ⭐⭐⭐⭐</option>
                    <option value="3">3 - Bom ⭐⭐⭐</option>
                    <option value="2">2 - Regular ⭐⭐</option>
                    <option value="1">1 - Ruim ⭐</option>
                </select>

                <label for="nota_estrutura">Nota Estrutura ✰✰✰✰✰</label>
                <select id="nota_estrutura">
                    <option value="0" disabled selected>deixe sua nota ✰✰✰✰✰</option>
                    <option value="5">5 - Excelente ⭐⭐⭐⭐⭐</option>
                    <option value="4">4 - Muito bom ⭐⭐⭐⭐</option>
                    <option value="3">3 - Bom ⭐⭐⭐</option>
                    <option value="2">2 - Regular ⭐⭐</option>
                    <option value="1">1 - Ruim ⭐</option>
                </select>

                <label for="nota_ambiente">Nota Ambiente ✰✰✰✰✰</label>
                <select id="nota_ambiente">
                    <option value="0" disabled selected>deixe sua nota ✰✰✰✰✰</option>
                    <option value="5">5 - Excelente ⭐⭐⭐⭐⭐</option>
                    <option value="4">4 - Muito bom ⭐⭐⭐⭐</option>
                    <option value="3">3 - Bom ⭐⭐⭐</option>
                    <option value="2">2 - Regular ⭐⭐</option>
                    <option value="1">1 - Ruim ⭐</option>
                </select>

                <label for="txt_comentario">Seu comentario</label>
                <textarea id="txt_comentario" maxlength="230"
                    placeholder="Conte como foi jogar aqui..."></textarea>

                <button type="submit">Enviar comentario</button>
            </form>
        </div>

        <div class="container-direita">
             <div class="titulo_comentario">

                <a href="dashboard_sesc.html"
                style="font-size: 24px;"  color: #222222;
                >Sesc</a>   
                <a href="dashboard_villa.html">VillaLobos</a>
                <a href="dashboard_pelezao.html"
                style="font-size: 24px;"  color: #222222;
                >Pelezão</a>

            </div>

            <div class="kpis">
                <div class="kpi" id="kpi_media">nota média<br>-</div>
                <div class="kpi" id="kpi_total">avaliações recebidas<br>0</div>
            </div>

            <span>Notas do Parque Villa-Lobos</span>

            <div>
                <canvas id="myChart"></canvas>
            </div>

           <h2>comentários da comunidade</h2>

                <div id="lista_comentarios" class="comentario"></div>
           
        </div>
    </div>

    <script src="js/sessao.js"></script>
    <script src="js/dashboard.js"></script>
</body>

</html>
