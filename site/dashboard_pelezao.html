<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="css/style_dashsboard.css">

    <title>Dashboard</title>
</head>

<body>
    <header>
        <div class="header">

            <div class="logo">
                <img src="img/imagem_logo.png" alt="">
            </div>

            <nav>
                <div class="home-btn">
                    <a href="home.html">Home</a>
                    <a href="dashboard_sesc.html">Dashboard</a>


                    <a href="login.html">login</a>
                    <a href="cadastro.html">cadastro</a>
                </div>
            </nav>
        </div>
    </header>

    <div class="container-geral">

        <div class="container-esquerda">

            <div class="usuario">
                <h2>Olá: <span id="nome_usuario">visitante</span></h2>
            </div>

            <select name="" id="selecao_local" onchange="mudar()">
                <option value="1" selected>Pelezão</option>
                <option value="2">Parque villa Lobos</option>
                <option value="3">Sesc Pompéia</option>
            </select>

            <form class="form-comentario" onsubmit="enviar_comentario(); return false;">
                <label for="sel_nota">Nota (1 a 5)</label>
                <select id="sel_nota">
                    <option value="5">5 - Excelente ⭐⭐⭐⭐⭐</option>
                    <option value="4">4 - Muito bom ⭐⭐⭐⭐</option>
                    <option value="3">3 - Bom ⭐⭐⭐</option>
                    <option value="2">2 - Regular ⭐⭐</option>
                    <option value="1">1 - Ruim ⭐</option>
                </select>

                <label for="txt_comentario">Seu comentario</label>

                <textarea id="txt_comentario" maxlength="230"
                    placeholder="Conte como foi jogar aqui..."></textarea>
                <button type="submit">Enviar comentario</button>
            </form>
        </div>

        <div class="container-direita">
            <h2>Pelezão</h2>

            <div class="kpi" id="kpi_media">nota média<br>-</div>
            <div class="kpi" id="kpi_total">avaliações recebidas<br>0</div>

            <span>Notas do Pelezão</span>

            <div>
                <canvas id="myChart"></canvas>
            </div>

            <details>
                <summary>comentários da comunidade</summary>

                <div id="lista_comentarios"></div>
            </details>
        </div>
    </div>

    <script src="js/sessao.js"></script>
    <script src="js/dashboard.js"></script>
</body>

</html>
