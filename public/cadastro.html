<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="css/style_login_volei.css">

</head>

<body>
    <div id="total">

        <header>
            <div class="header">

                <div class="logo">
                    <span class="bola"><img src="img/imagem_logo.png" alt=""></span>

                </div>

                <nav>
                    <div class="home-btn">
                        <a href="index.html">Home</a>
                        <a href="index.html#historia">História </a>
                        <a href="index.html#posicoes">Posições</a>
                        <a href="index.html#lugares">Lugares</a>


                        <a href="dashboard_pelezao.html">Comentários</a>
                        <a href="login.html">Login</a>
                        <a href="cadastro.html">Cadastro</a>

                    </div>

                </nav>

            </div>
        </header>







        <div class="login">
            <div class="img">
                <span>Seu novo time começa aqui</span>
            </div>

            <div class="campos-login">
                <div class="titulo">
                    <h1>Crie sua conta</h1>
                </div>

                <label for="ipt_nome">Seu nome</label>
                <input type="text" id="ipt_nome">


                <label for="ipt_login">Seu email</label>
                <input type="text" id="ipt_email">

                <label for="ipt_senha">Senha:</label>

                <div class="campo-senha">
                    <input type="password" id="ipt_senha">

                    <button class="btn-olho" id="btn_mostrar_senha"
                        onclick="alternar_senha('ipt_senha', 'btn_mostrar_senha')">
                        ⌣
                    </button>
                </div>


                <label for="ipt_confirmarsenha">Confirmar sua senha:</label>

                <div class="campo-senha">
                    <input type="password" id="ipt_confirmarsenha">

                    <button class="btn-olho" id="btn_mostrar_senha1"
                        onclick="alternar_senha('ipt_confirmarsenha', 'btn_mostrar_senha1')">
                        ⌣
                    </button>
                </div>


                <div class="btn-entrar">
                    <button onclick="cadastro()">Cadastrar</button>
                </div>

                <div class="logado">
                    <label>já tem conta?</label>
                    <button onclick="login()">Entrar na minha conta </button>

                </div>
                <div id="div_msg"></div>
            </div>


        </div>
    </div>
</body>

</html>
<script>
    function alternar_senha(id_campo, id_botao) {
        let campo = document.getElementById(id_campo);
        let botao = document.getElementById(id_botao);

        if (campo.type == "password") {
            campo.type = "text";
            botao.textContent = "👁";
        } else {
            campo.type = "password";
            botao.textContent = "⌣";
        }
    }

    function alternar_senha(id_campo, id_botao) {
        let campo = document.getElementById(id_campo);
        let botao = document.getElementById(id_botao);

        if (campo.type == "password") {
            campo.type = "text";
            botao.textContent = "👁";
        } else {
            campo.type = "password";
            botao.textContent = "⌣";
        }
    }


    function login() {
        window.location.href = "login.html";
    }

    function cadastro() {
        let nome = document.getElementById("ipt_nome").value;
        let email = document.getElementById("ipt_email").value;
        let senha = document.getElementById("ipt_senha").value;
        let confirmarSenha = document.getElementById("ipt_confirmarsenha").value;
        let div_msg = document.getElementById("div_msg");

        let temTamanho = senha.length >= 8;
        let temMaiuscula = senha != senha.toLowerCase();
        let temNumero = /[0-9]/.test(senha);



        if (nome == "" || email == "" || senha == "" || confirmarSenha == "") {
            div_msg.innerHTML = '<span style="color: brown;">Preencha todos os campos.</span>';
            return;
        }

        if (!email.includes("@")) {
            div_msg.innerHTML = '<span style="color: brown;">Digite um e-mail válido.</span>';
            return;
        }

        if (!temTamanho || !temMaiuscula || !temNumero) {
            div_msg.innerHTML = '<span style="color: brown;">A senha deve ter pelo menos 8 caracteres, uma letra maiúscula e um número.</span>';
            return;
        }





        if (senha != confirmarSenha) {
            div_msg.innerHTML = '<span style="color: brown;">As senhas não são iguais.</span>';
            return;
        }





        fetch("/usuarios/cadastrar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                nomeServer: nome,
                emailServer: email,
                senhaServer: senha
            })
        })
            .then(function (resposta) {
                if (resposta.ok) {
                    div_msg.innerHTML = '<span style="color: green;">Cadastro realizado! Redirecionando para o login...</span>';

                    setTimeout(function () {
                        window.location.href = "espera.html";
                    }, 1200);
                } else {
                    return resposta.text().then(function (texto) {
                        throw new Error(texto);
                    });
                }
            })
            .catch(function (erro) {
                div_msg.innerHTML = '<span style="color: brown;">Erro: ' + erro.message + '</span>';
            });
    }
</script>
